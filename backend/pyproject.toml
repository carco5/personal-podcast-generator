[project]
name = "podcast-backend"
version = "0.1.0"
description = "Personal podcast generator: API, scheduler worker and generation pipeline."
requires-python = ">=3.14"
dependencies = [
    "elevenlabs==2.69.0",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "openai==3.19.2",
    "pydantic-settings==2.15.0",
    "trafilatura==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
