x-backend: &backend
  build:
    context: ./backend
    target: api
  image: podcast-backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://podcast:podcast@db:5432/podcast
    DATA_DIR: /data
  volumes:
    - appdata:/data

services:
  db:
    image: postgres:18
    # Local-only credentials: the port is not published outside the Compose network.
    environment:
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: podcast
      POSTGRES_DB: podcast
    # Postgres 18+ keeps its data under /var/lib/postgresql/<major>/docker.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "podcast", "-d", "podcast"]
      interval: 5s
      timeout: 5s
      retries: 10

  prestart:
    <<: *backend
    command: ["python", "-m", "app.prestart"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    # Bound to localhost only: the API has no authentication and can spend provider credits.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      prestart:
        condition: service_completed_successfully

  # Optional: it generates episodes and spends provider credits. On stop it finishes the
  # episode in progress, so the grace period is longer than the default 10 s.
  worker:
    <<: *backend
    build:
      context: ./backend
      target: worker
    image: podcast-worker
    profiles: ["worker"]
    stop_grace_period: 10m
    depends_on:
      prestart:
        condition: service_completed_successfully

volumes:
  pgdata:
  appdata:
